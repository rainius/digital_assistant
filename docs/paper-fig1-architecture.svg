  <text x="580" y="674" text-anchor="middle" font-size="10" fill="#475569">语音识别</text>

  <rect x="658" y="630" width="136" height="58" rx="6" fill="#ffffff" stroke="#fbcfe8"/>
  <text x="726" y="654" text-anchor="middle" font-size="12" font-weight="600" fill="#9d174d">GPT-SoVITS</text>
