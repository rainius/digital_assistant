  <text x="874" y="674" text-anchor="middle" font-size="10" fill="#475569">真人分身渲染</text>

  <text x="500" y="744" text-anchor="middle" font-size="12" fill="#64748b">前端在浏览器内运行；后端服务与模型部署于同一台设备或同一内网，对外网与第三方接口无依赖</text>
  <text x="22" y="386" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90,22,386)" letter-spacing="2">依赖方向</text>
