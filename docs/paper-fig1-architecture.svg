  <rect x="772" y="468" width="172" height="84" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <text x="858" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">LiveTalking 服务</text>
  <text x="858" y="524" text-anchor="middle" font-size="11" fill="#475569">真人分身渲染</text>

  <line x1="500" y1="580" x2="500" y2="608" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

