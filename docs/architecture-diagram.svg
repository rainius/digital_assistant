<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <!-- 箭头标记 -->
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>

    <!-- 层渐变 -->
    <linearGradient id="gLayer1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="gLayer2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="gLayer3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="gLayer4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fce7e7"/>
    </linearGradient>

    <!-- 组件卡片阴影 -->
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/>
    </filter>
    <filter id="layerShadow" x="-1%" y="-2%" width="102%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- ==================== 标题 ==================== -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">数字人交互系统分层架构</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#94a3b8">Layered Architecture for Digital Human Interaction System</text>

  <!-- ==================== 第1层：表现层 ==================== -->
  <rect x="36" y="78" width="888" height="142" rx="10" fill="url(#gLayer1)" stroke="#c7d2fe" stroke-width="1.5" filter="url(#layerShadow)"/>
  <rect x="36" y="78" width="888" height="34" rx="10" fill="#6366f1"/>
  <rect x="36" y="96" width="888" height="16" fill="#6366f1"/>
  <text x="56" y="100" font-size="14" font-weight="700" fill="#ffffff">表现层  Presentation Layer</text>
  <text x="900" y="100" font-size="11" fill="rgba(255,255,255,0.70)" text-anchor="end">用户交互界面 · Live2D 渲染 · 语音交互反馈</text>

  <!-- 表现层组件 -->
  <rect x="60" y="126" width="156" height="80" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="138" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">UserInfoPanel</text>
  <text x="138" y="172" text-anchor="middle" font-size="9" fill="#64748b">用户信息与课程</text>
  <text x="138" y="188" text-anchor="middle" font-size="9" fill="#94a3b8">静态展示组件</text>

  <rect x="232" y="126" width="156" height="80" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="310" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">AvatarStage</text>
  <text x="310" y="172" text-anchor="middle" font-size="9" fill="#64748b">数字人舞台 · 拖拽</text>
  <text x="310" y="188" text-anchor="middle" font-size="9" fill="#94a3b8">Live2D 容器 · 波形动画</text>

  <rect x="404" y="126" width="156" height="80" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="482" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">AIChatPanel</text>
  <text x="482" y="172" text-anchor="middle" font-size="9" fill="#64748b">流式对话 · Markdown</text>
  <text x="482" y="188" text-anchor="middle" font-size="9" fill="#94a3b8">语音输入 · 模式切换</text>

  <rect x="576" y="126" width="156" height="80" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="654" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">VoiceButton</text>
  <text x="654" y="172" text-anchor="middle" font-size="9" fill="#64748b">Siri 风格录音按钮</text>
  <text x="654" y="188" text-anchor="middle" font-size="9" fill="#94a3b8">呼吸动画 · 光晕效果</text>

  <rect x="748" y="126" width="152" height="80" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="824" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">WaveformView</text>
  <text x="824" y="172" text-anchor="middle" font-size="9" fill="#64748b">Web Audio API</text>
  <text x="824" y="188" text-anchor="middle" font-size="9" fill="#94a3b8">实时声波滚动</text>

  <!-- 表现层 → 应用逻辑层 调用箭头 -->
  <line x1="310" y1="206" x2="280" y2="278" stroke="#6366f1" stroke-width="1" marker-end="url(#arrowIndigo)" opacity="0.45" stroke-dasharray="5,3"/>
  <line x1="482" y1="206" x2="446" y2="278" stroke="#6366f1" stroke-width="1" marker-end="url(#arrowIndigo)" opacity="0.45" stroke-dasharray="5,3"/>

  <!-- 层间连接线 1→2 -->
  <line x1="480" y1="220" x2="480" y2="250" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)" stroke-dasharray="4,3"/>

  <!-- ==================== 第2层：应用逻辑层 ==================== -->
  <rect x="36" y="256" width="888" height="142" rx="10" fill="url(#gLayer2)" stroke="#bbf7d0" stroke-width="1.5" filter="url(#layerShadow)"/>
  <rect x="36" y="256" width="888" height="34" rx="10" fill="#16a34a"/>
  <rect x="36" y="274" width="888" height="16" fill="#16a34a"/>
  <text x="56" y="278" font-size="14" font-weight="700" fill="#ffffff">应用逻辑层  Application Logic Layer</text>
  <text x="900" y="278" font-size="11" fill="rgba(255,255,255,0.70)" text-anchor="end">Composable 组合 · 数据流编排 · 回调串联</text>

  <!-- 5个 Composable -->
  <rect x="60" y="304" width="154" height="80" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="137" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">useChatStream</text>
  <text x="137" y="348" text-anchor="middle" font-size="9" fill="#64748b">流式对话管理</text>
  <text x="137" y="364" text-anchor="middle" font-size="9" fill="#94a3b8">句子边界检测 · 世代号竞态</text>

  <rect x="228" y="304" width="154" height="80" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="305" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">useTTSQueue</text>
  <text x="305" y="348" text-anchor="middle" font-size="9" fill="#64748b">串行音频播放队列</text>
  <text x="305" y="364" text-anchor="middle" font-size="9" fill="#94a3b8">Blob URL 生命周期管理</text>

  <rect x="396" y="304" width="154" height="80" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="473" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">useVoiceRecorder</text>
  <text x="473" y="348" text-anchor="middle" font-size="9" fill="#64748b">录音状态机</text>
  <text x="473" y="364" text-anchor="middle" font-size="9" fill="#94a3b8">ASR 回调衔接</text>

  <rect x="564" y="304" width="154" height="80" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="641" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">useAvatar</text>
  <text x="641" y="348" text-anchor="middle" font-size="9" fill="#64748b">模型生命周期管理</text>
  <text x="641" y="364" text-anchor="middle" font-size="9" fill="#94a3b8">运行时模型切换</text>

  <rect x="732" y="304" width="154" height="80" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="809" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">useDraggable</text>
  <text x="809" y="348" text-anchor="middle" font-size="9" fill="#64748b">通用拖拽交互</text>
  <text x="809" y="364" text-anchor="middle" font-size="9" fill="#94a3b8">位置状态管理</text>

  <!-- 应用逻辑层 → 服务适配层 调用箭头 -->
  <line x1="305" y1="384" x2="305" y2="466" stroke="#16a34a" stroke-width="1" marker-end="url(#arrowGreen)" opacity="0.45" stroke-dasharray="5,3"/>
  <line x1="641" y1="384" x2="641" y2="466" stroke="#16a34a" stroke-width="1" marker-end="url(#arrowGreen)" opacity="0.45" stroke-dasharray="5,3"/>

  <!-- 层间连接线 2→3 -->
  <line x1="480" y1="398" x2="480" y2="428" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)" stroke-dasharray="4,3"/>

  <!-- ==================== 第3层：服务适配层 ==================== -->
  <rect x="36" y="434" width="888" height="142" rx="10" fill="url(#gLayer3)" stroke="#fde68a" stroke-width="1.5" filter="url(#layerShadow)"/>
  <rect x="36" y="434" width="888" height="34" rx="10" fill="#d97706"/>
  <rect x="36" y="452" width="888" height="16" fill="#d97706"/>
  <text x="56" y="456" font-size="14" font-weight="700" fill="#ffffff">服务适配层  Service Adapter Layer</text>
  <text x="900" y="456" font-size="11" fill="rgba(255,255,255,0.70)" text-anchor="end">Factory + Adapter 策略模式 · 引擎抽象 · 异构通信封装</text>

  <!-- 4个 Factory -->
  <rect x="60" y="482" width="194" height="80" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="157" y="508" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">ASRFactory</text>
  <text x="157" y="526" text-anchor="middle" font-size="9" fill="#64748b">SenseVoiceAdapter</text>
  <text x="157" y="542" text-anchor="middle" font-size="9" fill="#94a3b8">HTTP REST · 16kHz WAV</text>

  <rect x="270" y="482" width="194" height="80" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="367" y="508" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">LLMFactory</text>
  <text x="367" y="526" text-anchor="middle" font-size="9" fill="#64748b">DifyAdapter · CozeAdapter</text>
  <text x="367" y="542" text-anchor="middle" font-size="9" fill="#94a3b8">SSE 流解析 · 上下文管理</text>

  <rect x="480" y="482" width="194" height="80" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="577" y="508" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">TTSFactory</text>
  <text x="577" y="526" text-anchor="middle" font-size="9" fill="#64748b">GPT-SoVITS · EdgeTTS</text>
  <text x="577" y="542" text-anchor="middle" font-size="9" fill="#94a3b8">HTTP REST · 短句合成</text>

  <rect x="690" y="482" width="210" height="80" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="795" y="508" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">AvatarFactory</text>
  <text x="795" y="526" text-anchor="middle" font-size="9" fill="#64748b">Live2DAdapter</text>
  <text x="795" y="542" text-anchor="middle" font-size="9" fill="#94a3b8">PIXI.js · 口型同步</text>

  <!-- 层间连接线 3→4 -->
  <line x1="480" y1="576" x2="480" y2="606" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)" stroke-dasharray="4,3"/>

  <!-- ==================== 第4层：基础设施层 ==================== -->
  <rect x="36" y="612" width="888" height="78" rx="10" fill="url(#gLayer4)" stroke="#fecaca" stroke-width="1.5" filter="url(#layerShadow)"/>
  <rect x="36" y="612" width="888" height="34" rx="10" fill="#dc2626"/>
  <rect x="36" y="630" width="888" height="16" fill="#dc2626"/>
  <text x="56" y="634" font-size="14" font-weight="700" fill="#ffffff">基础设施层  Infrastructure Layer</text>
  <text x="900" y="634" font-size="11" fill="rgba(255,255,255,0.70)" text-anchor="end">外部 AI 引擎 · 网络传输 · 模型推理 · 第三方 SDK</text>

  <rect x="60" y="652" width="194" height="28" rx="4" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="157" y="670" text-anchor="middle" font-size="10" fill="#991b1b">SenseVoice 语音识别服务</text>

  <rect x="270" y="652" width="194" height="28" rx="4" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="367" y="670" text-anchor="middle" font-size="10" fill="#991b1b">Dify / Coze LLM 平台</text>

  <rect x="480" y="652" width="194" height="28" rx="4" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="577" y="670" text-anchor="middle" font-size="10" fill="#991b1b">GPT-SoVITS / Edge TTS</text>

  <rect x="690" y="652" width="210" height="28" rx="4" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="795" y="670" text-anchor="middle" font-size="10" fill="#991b1b">Live2D Cubism SDK</text>

  <!-- ==================== 数据流通道（右侧标注） ==================== -->
  <rect x="938" y="78" width="14" height="612" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="945" y="400" text-anchor="middle" font-size="9" fill="#94a3b8" transform="rotate(90, 945, 400)" letter-spacing="3">数据流方向：上 → 下</text>

  <!-- ==================== 底部：全链路数据流 ==================== -->
  <rect x="36" y="704" width="888" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <text x="56" y="724" font-size="10" font-weight="600" fill="#475569">全链路数据流:</text>

  <!-- 步骤 1 -->
  <circle cx="160" cy="730" r="11" fill="#6366f1"/>
  <text x="160" y="734" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text>
  <text x="178" y="734" font-size="9" fill="#475569">语音/文本输入</text>

  <!-- 右箭头 -->
  <text x="260" y="734" text-anchor="middle" font-size="10" fill="#cbd5e1">→</text>

  <!-- 步骤 2 -->
  <circle cx="296" cy="730" r="11" fill="#6366f1"/>
  <text x="296" y="734" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text>
  <text x="314" y="734" font-size="9" fill="#475569">ASR 识别</text>

  <text x="384" y="734" text-anchor="middle" font-size="10" fill="#cbd5e1">→</text>

  <!-- 步骤 3 -->
  <circle cx="420" cy="730" r="11" fill="#16a34a"/>
  <text x="420" y="734" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text>
  <text x="438" y="734" font-size="9" fill="#475569">LLM 流式生成</text>

  <text x="520" y="734" text-anchor="middle" font-size="10" fill="#cbd5e1">→</text>

  <!-- 步骤 4 -->
  <circle cx="556" cy="730" r="11" fill="#16a34a"/>
  <text x="556" y="734" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">4</text>
  <text x="574" y="734" font-size="9" fill="#475569">句子切分 · TTS 合成</text>

  <text x="668" y="734" text-anchor="middle" font-size="10" fill="#cbd5e1">→</text>

  <!-- 步骤 5 -->
  <circle cx="704" cy="730" r="11" fill="#d97706"/>
  <text x="704" y="734" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">5</text>
  <text x="722" y="734" font-size="9" fill="#475569">数字人口型同步播放</text>

  <!-- ==================== 左侧：通信协议标注 ==================== -->
  <rect x="4" y="270" width="24" height="370" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="16" y="490" text-anchor="middle" font-size="8" fill="#94a3b8" transform="rotate(-90, 16, 490)" letter-spacing="1">SSE · HTTP REST · WebRTC(预留)</text>

</svg>
